case_id: "topic-string-literal"
layer: 1
axis: "topic-indirection"
variant: "level-1-string-literal"
description: "Topic name appears as a bare string literal at both the produce and subscribe call sites."

services:
  - name: "catalog-service"
    role: "producer"
  - name: "search-service"
    role: "consumer"

topics:
  - name: "shopflow.products.updated"
    broker: "kafka"

edges:
  - producer: "catalog-service"
    topic: "shopflow.products.updated"
    consumer: "search-service"

payloads:
  - producer: "catalog-service"
    topic: "shopflow.products.updated"
    schema_type: "pydantic"
    schema:
      model_name: "ProductUpdatedEvent"
      fields:
        product_id: "str"
        name: "str"
        price_cents: "int"
        category: "str"

annotations: {}

channel_visibility:
  edges:
    - edge: ["catalog-service", "shopflow.products.updated", "search-service"]
      static: "full"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
