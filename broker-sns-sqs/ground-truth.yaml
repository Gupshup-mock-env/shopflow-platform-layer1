case_id: "broker-sns-sqs"
layer: 1
axis: "broker"
variant: "sns-sqs"
description: "AWS SNS/SQS via LocalStack. The producer-to-consumer link exists only in Terraform."

services:
  - name: "shipping-service"
    role: "producer"
  - name: "tracking-service"
    role: "consumer"

topics:
  - name: "shopflow-shipment-events"
    broker: "sns"

edges:
  - producer: "shipping-service"
    topic: "shopflow-shipment-events"
    consumer: "tracking-service"

payloads:
  - producer: "shipping-service"
    topic: "shopflow-shipment-events"
    schema_type: "dict-literal"
    schema:
      fields:
        shipment_id: "str"
        carrier: "str"
        tracking_number: "str"
        status: "str"
        estimated_delivery: "str"

annotations: {}

channel_visibility:
  edges:
    - edge: ["shipping-service", "shopflow-shipment-events", "tracking-service"]
      static: "blind"
      apm: "full"
      broker: "full"
      iac: "full"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: true
