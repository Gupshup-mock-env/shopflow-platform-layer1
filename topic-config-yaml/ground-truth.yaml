case_id: "topic-config-yaml"
layer: 1
axis: "topic-indirection"
variant: "config-yaml"
description: "Topic name resolved from a YAML config file checked into the repo and mounted into both containers."

services:
  - name: "inventory-service"
    role: "producer"
  - name: "warehouse-service"
    role: "consumer"

topics:
  - name: "shopflow.inventory.stock_updated"
    broker: "kafka"

edges:
  - producer: "inventory-service"
    topic: "shopflow.inventory.stock_updated"
    consumer: "warehouse-service"

payloads:
  - producer: "inventory-service"
    topic: "shopflow.inventory.stock_updated"
    schema_type: "pydantic"
    schema:
      model_name: "StockUpdatedEvent"
      fields:
        sku: "str"
        warehouse_id: "str"
        quantity_delta: "int"
        reason: "str"

annotations: {}

channel_visibility:
  edges:
    - edge: ["inventory-service", "shopflow.inventory.stock_updated", "warehouse-service"]
      static: "full"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
