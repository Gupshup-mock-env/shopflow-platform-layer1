# ShopFlow inventory platform configuration.
# Loaded by every service in this repository at startup.

service:
  domain: "inventory"
  health_port: 8080

messaging:
  broker: "kafka"
  publish_interval_seconds: 2
  delivery_timeout_seconds: 10
  topics:
    stock_updated: "shopflow.inventory.stock_updated"

consumers:
  warehouse-service:
    group_id: "warehouse-service"
    auto_offset_reset: "earliest"
    poll_timeout_seconds: 1.0
