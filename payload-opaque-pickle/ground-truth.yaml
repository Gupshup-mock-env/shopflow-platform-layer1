case_id: "payload-opaque-pickle"
layer: 1
axis: "payload"
variant: "opaque-pickle"
description: "Kafka edge is discoverable but the payload is a pickled plain-Python object, so no channel recovers its schema."

services:
  - name: "legacy-service"
    role: "producer"
  - name: "processor-service"
    role: "consumer"

topics:
  - name: "shopflow.legacy.order_sync"
    broker: "kafka"

edges:
  - producer: "legacy-service"
    topic: "shopflow.legacy.order_sync"
    consumer: "processor-service"

payloads:
  - producer: "legacy-service"
    topic: "shopflow.legacy.order_sync"
    schema_type: "opaque"
    encoding: "pickle"
    note: "Schema not recoverable from any discovery channel."

annotations: {}

channel_visibility:
  edges:
    - edge: ["legacy-service", "shopflow.legacy.order_sync", "processor-service"]
      static: "partial"
      apm: "blind"
      broker: "blind"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
