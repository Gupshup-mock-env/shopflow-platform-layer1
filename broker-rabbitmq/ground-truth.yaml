case_id: "broker-rabbitmq"
layer: 1
axis: "broker"
variant: "rabbitmq"
description: "RabbitMQ baseline. Topic exchange, routing key, binding pattern. Requires J4 resolution."

services:
  - name: "notification-service"
    role: "producer"
  - name: "email-service"
    role: "consumer"

topics:
  - name: "shopflow.notifications"
    broker: "rabbitmq"

edges:
  - producer: "notification-service"
    topic: "shopflow.notifications"
    consumer: "email-service"
    routing_key: "notification.email.order_confirmed"
    binding_pattern: "notification.email.#"

payloads:
  - producer: "notification-service"
    topic: "shopflow.notifications"
    schema_type: "dataclass"
    schema:
      model_name: "OrderConfirmedNotification"
      fields:
        notification_id: "str"
        recipient_email: "str"
        order_id: "str"
        order_total: "str"
        items_summary: "str"

annotations: {}

channel_visibility:
  edges:
    - edge: ["notification-service", "shopflow.notifications", "email-service"]
      static: "full"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
