case_id: "framework-celery"
layer: 1
axis: "framework"
variant: "celery-task-queue"
description: "Celery over RabbitMQ: the edge is a task call resolved to a queue by celeryconfig task_routes."

services:
  - name: "order-service"
    role: "producer"
  - name: "payment-worker"
    role: "consumer"

topics:
  - name: "payments"
    broker: "rabbitmq"

edges:
  - producer: "order-service"
    topic: "payments"
    consumer: "payment-worker"
    routing_key: "payments"
    binding_pattern: "payments"

payloads:
  - producer: "order-service"
    topic: "payments"
    schema_type: "task-kwargs"
    schema:
      model_name: "orders.tasks.process_payment"
      fields:
        order_id: "str"
        amount_cents: "int"

annotations: {}

channel_visibility:
  edges:
    - edge: ["order-service", "payments", "payment-worker"]
      static: "partial"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
