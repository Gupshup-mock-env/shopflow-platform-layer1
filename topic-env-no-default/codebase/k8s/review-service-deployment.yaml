apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: shopflow
  labels:
    app.kubernetes.io/name: review-service
    app.kubernetes.io/part-of: shopflow
    shopflow.io/domain: risk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: review-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review-service
        app.kubernetes.io/part-of: shopflow
    spec:
      containers:
        - name: review-service
          image: registry.shopflow.internal/risk/review-service:2.1.0
          envFrom:
            - configMapRef:
                name: fraud-messaging-config
          env:
            - name: SERVICE_NAME
              value: "review-service"
            - name: KAFKA_CONSUMER_GROUP
              value: "review-service"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
