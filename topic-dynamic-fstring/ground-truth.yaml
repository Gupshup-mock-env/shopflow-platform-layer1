case_id: "topic-dynamic-fstring"
layer: 1
axis: "topic-indirection"
variant: "dynamic-fstring-fanout"
description: "Topic names are composed at runtime by an f-string over region and event type, so three concrete topics exist that appear nowhere in the source."

services:
  - name: "analytics-service"
    role: "producer"
  - name: "aggregator-service"
    role: "consumer"

topics:
  - name: "shopflow.analytics.us-east-1.page_view"
    broker: "kafka"
  - name: "shopflow.analytics.us-east-1.purchase"
    broker: "kafka"
  - name: "shopflow.analytics.us-east-1.click"
    broker: "kafka"

edges:
  - producer: "analytics-service"
    topic: "shopflow.analytics.us-east-1.page_view"
    consumer: "aggregator-service"
  - producer: "analytics-service"
    topic: "shopflow.analytics.us-east-1.purchase"
    consumer: "aggregator-service"
  - producer: "analytics-service"
    topic: "shopflow.analytics.us-east-1.click"
    consumer: "aggregator-service"

payloads:
  - producer: "analytics-service"
    topic: "shopflow.analytics.us-east-1.page_view"
    schema_type: "pydantic"
    schema:
      model_name: "AnalyticsEvent"
      fields:
        event_type: "str"
        user_id: "str"
        session_id: "str"
        timestamp: "str"
        properties: "dict"
  - producer: "analytics-service"
    topic: "shopflow.analytics.us-east-1.purchase"
    schema_type: "pydantic"
    schema:
      model_name: "AnalyticsEvent"
      fields:
        event_type: "str"
        user_id: "str"
        session_id: "str"
        timestamp: "str"
        properties: "dict"
  - producer: "analytics-service"
    topic: "shopflow.analytics.us-east-1.click"
    schema_type: "pydantic"
    schema:
      model_name: "AnalyticsEvent"
      fields:
        event_type: "str"
        user_id: "str"
        session_id: "str"
        timestamp: "str"
        properties: "dict"

annotations: {}

channel_visibility:
  edges:
    - edge: ["analytics-service", "shopflow.analytics.us-east-1.page_view", "aggregator-service"]
      static: "blind"
      apm: "full"
      broker: "full"
      iac: "blind"
    - edge: ["analytics-service", "shopflow.analytics.us-east-1.purchase", "aggregator-service"]
      static: "blind"
      apm: "full"
      broker: "full"
      iac: "blind"
    - edge: ["analytics-service", "shopflow.analytics.us-east-1.click", "aggregator-service"]
      static: "blind"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
