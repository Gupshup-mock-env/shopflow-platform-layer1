case_id: "framework-kombu"
layer: 1
axis: "framework"
variant: "kombu-exchange-queue-objects"
description: "Kombu Exchange/Queue/Producer/Consumer objects over RabbitMQ: the addressing unit is the exchange name."

services:
  - name: "event-service"
    role: "producer"
  - name: "audit-service"
    role: "consumer"

topics:
  - name: "shopflow.events"
    broker: "rabbitmq"

edges:
  - producer: "event-service"
    topic: "shopflow.events"
    consumer: "audit-service"
    routing_key: "event.order.created"
    binding_pattern: "event.#"

payloads:
  - producer: "event-service"
    topic: "shopflow.events"
    schema_type: "dict-literal"
    schema:
      fields:
        event_type: "str"
        order_id: "str"
        customer_id: "str"
        total_cents: "int"
        occurred_at: "str"

annotations: {}

channel_visibility:
  edges:
    - edge: ["event-service", "shopflow.events", "audit-service"]
      static: "full"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
