case_id: "topic-convention-celery"
layer: 1
axis: "topic-indirection"
variant: "celery-task-route-convention"
description: "The destination is a Celery queue reached only by following a task name through task_routes, so the answer is the queue name and not the task name."

services:
  - name: "billing-service"
    role: "producer"
  - name: "invoice-worker"
    role: "consumer"

topics:
  - name: "invoicing"
    broker: "rabbitmq"

edges:
  - producer: "billing-service"
    topic: "invoicing"
    consumer: "invoice-worker"
    routing_key: "invoicing"
    binding_pattern: "invoicing"

payloads:
  - producer: "billing-service"
    topic: "invoicing"
    schema_type: "task-kwargs"
    schema:
      model_name: "billing.tasks.generate_invoice"
      fields:
        order_id: "str"
        amount_cents: "int"

annotations: {}

channel_visibility:
  edges:
    - edge: ["billing-service", "invoicing", "invoice-worker"]
      static: "partial"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
