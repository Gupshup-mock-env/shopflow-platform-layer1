case_id: "framework-faust"
layer: 1
axis: "framework"
variant: "faust-agent-topic"
description: "Faust on Kafka: the topic and its schema are declared once at app.topic(..., value_type=ClickEvent); the producer calls topic.send and the consumer binds an @app.agent to the same topic object."

services:
  - name: "clickstream-service"
    role: "producer"
  - name: "metrics-service"
    role: "consumer"

topics:
  - name: "shopflow.clickstream.raw"
    broker: "kafka"

edges:
  - producer: "clickstream-service"
    topic: "shopflow.clickstream.raw"
    consumer: "metrics-service"

payloads:
  - producer: "clickstream-service"
    topic: "shopflow.clickstream.raw"
    schema_type: "faust-record"
    schema:
      model_name: "ClickEvent"
      fields:
        user_id: "str"
        page: "str"
        action: "str"
        timestamp: "float"

annotations: {}

channel_visibility:
  edges:
    - edge: ["clickstream-service", "shopflow.clickstream.raw", "metrics-service"]
      static: "full"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
