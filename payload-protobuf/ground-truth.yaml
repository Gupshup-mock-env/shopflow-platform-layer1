case_id: "payload-protobuf"
layer: 1
axis: "payload"
variant: "protobuf-generated-module"
description: "Kafka producer/consumer on a literal topic where the payload is a protobuf message compiled from a .proto at image build time."

services:
  - name: "logistics-service"
    role: "producer"
  - name: "route-service"
    role: "consumer"

topics:
  - name: "shopflow.logistics.shipment_updated"
    broker: "kafka"

edges:
  - producer: "logistics-service"
    topic: "shopflow.logistics.shipment_updated"
    consumer: "route-service"

payloads:
  - producer: "logistics-service"
    topic: "shopflow.logistics.shipment_updated"
    schema_type: "protobuf"
    schema_file: "proto/shipment.proto"
    encoding: "protobuf-binary"
    schema:
      model_name: "ShipmentUpdate"
      fields:
        shipment_id: "string"
        origin: "string"
        destination: "string"
        status: "Status"
        updated_at: "int64"
      enums:
        Status:
          PENDING: 0
          IN_TRANSIT: 1
          DELIVERED: 2

annotations: {}

channel_visibility:
  edges:
    - edge: ["logistics-service", "shopflow.logistics.shipment_updated", "route-service"]
      static: "full"
      apm: "partial"
      broker: "blind"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
