AMQP_URI: amqp://${RABBITMQ_USER:guest}:${RABBITMQ_PASSWORD:guest}@${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}//

max_workers: 10
parent_calls_tracked: 10

LOGGING:
  version: 1
  disable_existing_loggers: false
  formatters:
    plain:
      format: "%(asctime)s %(levelname)s %(name)s %(message)s"
  handlers:
    stderr:
      class: logging.StreamHandler
      stream: "ext://sys.stderr"
      formatter: plain
  root:
    level: INFO
    handlers:
      - stderr
