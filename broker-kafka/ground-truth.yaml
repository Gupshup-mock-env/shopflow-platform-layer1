case_id: "broker-kafka"
layer: 1
axis: "broker"
variant: "kafka"
description: "Kafka baseline. String literal topic, Pydantic payload, confluent-kafka client."

services:
  - name: "order-service"
    role: "producer"
  - name: "payment-service"
    role: "consumer"

topics:
  - name: "shopflow.orders.created"
    broker: "kafka"

edges:
  - producer: "order-service"
    topic: "shopflow.orders.created"
    consumer: "payment-service"

payloads:
  - producer: "order-service"
    topic: "shopflow.orders.created"
    schema_type: "pydantic"
    schema:
      model_name: "OrderCreatedEvent"
      fields:
        order_id: "str"
        customer_id: "str"
        total_cents: "int"
        currency: "str"
        items: "list[OrderItem]"
      nested:
        OrderItem:
          sku: "str"
          quantity: "int"
          price_cents: "int"

annotations: {}

channel_visibility:
  edges:
    - edge: ["order-service", "shopflow.orders.created", "payment-service"]
      static: "full"
      apm: "full"
      broker: "full"
      iac: "blind"

channel_inputs_available:
  broker_metadata: true
  apm_traces: true
  iac: false
